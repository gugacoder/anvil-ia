###############################################################################
# vHost <DOMAIN> — Authelia forward-auth + Caddy interno do projeto
#
# Substituicoes antes de aplicar:
#   <DOMAIN>       — dominio publico (ex: meuapp.processa.info)
#   <PROJECT>      — slug do projeto (ex: meuapp)
#   <ENV>          — environment do compose (geralmente `development` no NIC)
#   <PUBLIC_PORT>  — porta interna do Caddy do projeto (do .env do servidor)
#
# Destino: /projetos/proxy/nginx/conf.d/<DOMAIN>.conf
# Apos copiar: `docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload`
#
# IMPORTANTE — resolver dinamico:
#   `resolver 127.0.0.11 valid=10s` + `set $upstream "..."` + `proxy_pass http://$upstream`
#   forca o nginx a re-resolver o nome do container a cada request (cache de 10s).
#   Sem isso, se o container do projeto for recriado (`compose up/restart`),
#   ele ganha IP novo na rede Docker, mas o nginx-proxy fica preso no IP velho
#   cacheado -> "connect() failed (113: No route to host)" -> 502 em todo o site.
#   Detalhe em references/gotchas.md ("nginx-proxy cacheia IP do upstream").
#
# Estrutura de auth:
#   • `/` (raiz)       — bypass Authelia, Caddy interno redireciona p/ landing
#   • `/landing`       — bypass Authelia (pagina publica)
#   • `/api/`          — Authelia COM fallback (@api_backend_auth) p/ API key/JWT
#   • `/health`        — bypass Authelia (healthchecks)
#   • Tudo o mais      — Authelia obrigatorio (`/hub`, `/portal`, etc.)
###############################################################################

# --- HTTP -> HTTPS ---------------------------------------------------------
server {
    listen 80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/nginx/certs/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/<DOMAIN>/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Docker embedded DNS — re-resolve upstream names com TTL curto
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstreams como variaveis — obriga nginx a re-resolver a cada request
    set $caddy_upstream     "<PROJECT>-<ENV>-caddy-1:<PUBLIC_PORT>";
    set $authelia_upstream  "http://authelia:9091/api/verify";

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Authelia internal endpoints ─────────────────────────────────────────
    location = /internal/authelia/authz {
        internal;
        proxy_pass $authelia_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @authelia_login {
        set $target_url $scheme://$http_host$request_uri;
        return 302 https://proxy.processa.info/?rd=$target_url;
    }

    # ── Health (bypass Authelia) ────────────────────────────────────────────
    location = /health {
        proxy_pass http://$caddy_upstream;
        proxy_set_header Host $host;
    }

    # ── WebSocket / Socket.IO (bypass Authelia) ─────────────────────────────
    # O apps/ws faz a propria auth no handshake (cookie de sessao Coletivos,
    # Bearer ApiKey ou System SystemKey — ver apps/ws/src/auth.ts). Authelia
    # em cima do /ws causa dois problemas:
    #   1. Sem sessao Authelia, o handshake retorna 302 e o socket.io morre
    #      (socket.io nao segue redirects).
    #   2. Em transport=polling, cada XHR re-bate em Authelia. Se a sessao
    #      Authelia expirar com a conexao viva, o proximo poll vira 302 e
    #      mata silenciosamente a presence (sintoma "online nao pendura").
    # Bypass aqui = backend continua sendo a autoridade de auth do WS.
    location /ws/ {
        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;

        proxy_redirect   off;
        proxy_buffering  off;

        # WebSocket: timeouts longos pra conexoes persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;

        proxy_redirect   off;
        proxy_buffering  off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Raiz (bypass Authelia) — Caddy interno redireciona / -> /landing ────
    # Necessario porque sem isso o location `/` (com Authelia) bloqueia ainda
    # antes do Caddy receber a request, e o usuario nunca chega na landing.
    location = / {
        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect   off;
        proxy_buffering  off;
    }

    # ── Landing publica (bypass Authelia) — marketing / pagina inicial ──────
    location /landing {
        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect   off;
        proxy_buffering  off;
    }

    # ── API com Authelia + fallback (API key / JWT direto no backend) ───────
    location /api/ {
        auth_request /internal/authelia/authz;

        auth_request_set $authelia_user   $upstream_http_remote_user;
        auth_request_set $authelia_email  $upstream_http_remote_email;
        auth_request_set $authelia_groups $upstream_http_remote_groups;
        auth_request_set $authelia_name   $upstream_http_remote_name;

        error_page 401 = @api_backend_auth;

        proxy_set_header Remote-User    $authelia_user;
        proxy_set_header Remote-Email   $authelia_email;
        proxy_set_header Remote-Groups  $authelia_groups;
        proxy_set_header Remote-Name    $authelia_name;

        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;

        proxy_redirect   off;
        proxy_buffering  off;

        # SSE support
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location @api_backend_auth {
        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;

        proxy_redirect   off;
        proxy_buffering  off;

        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Tudo o mais (/hub, /portal, …): Authelia obrigatorio
    # `/ws` e `/socket.io` ja tem location dedicada com bypass acima — esta
    # location nao precisa pensar em WebSocket. Mantemos `Upgrade`/`Connection`
    # mesmo assim por defensividade (qualquer outro upgrade futuro).
    location / {
        auth_request /internal/authelia/authz;

        auth_request_set $authelia_user   $upstream_http_remote_user;
        auth_request_set $authelia_email  $upstream_http_remote_email;
        auth_request_set $authelia_groups $upstream_http_remote_groups;
        auth_request_set $authelia_name   $upstream_http_remote_name;

        error_page 401 =302 @authelia_login;

        proxy_set_header Remote-User    $authelia_user;
        proxy_set_header Remote-Email   $authelia_email;
        proxy_set_header Remote-Groups  $authelia_groups;
        proxy_set_header Remote-Name    $authelia_name;

        proxy_pass http://$caddy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect   off;
        proxy_buffering  off;

        # SSE / WebSocket: timeouts longos pra conexoes persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# `Connection` precisa virar `upgrade` quando o cliente manda Upgrade,
# senao virar `close`. Mapa global — Authelia/proxy reverso compartilham.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
