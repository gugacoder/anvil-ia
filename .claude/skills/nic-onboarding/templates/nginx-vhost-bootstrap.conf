###############################################################################
# vHost <DOMAIN> — FASE 1 (bootstrap, HTTP-only)
#
# Usado APENAS pra emitir o cert Let's Encrypt via webroot ACME challenge.
# Apos cert disponivel, e' substituido pelo nginx-vhost.conf (HTTPS completo).
#
# Por que essa fase existe: o vhost final referencia
# /etc/nginx/certs/live/<DOMAIN>/{fullchain.pem,private.key} — esses arquivos
# nao existem antes do certbot rodar. Sem este vhost mínimo, requests pra
# http://<DOMAIN>/.well-known/acme-challenge/... caem no default_server do
# nginx-proxy, que nao serve o webroot. Resultado: certbot falha com 404 no
# challenge.
#
# Substituicoes antes de aplicar:
#   <DOMAIN> — dominio publico (ex: meuapp.processa.info)
#
# Destino: /projetos/proxy/nginx/conf.d/<DOMAIN>.conf
###############################################################################

server {
    listen 80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Provisioning SSL cert, please wait...\n';
        add_header Content-Type text/plain;
    }
}
